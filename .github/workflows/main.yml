name: Build KOJA AFRICA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KOJA Android project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk \
             output/KOJA-AFRICA-Standalone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOJA-AFRICA-Standalone-APK
          path: output/KOJA-AFRICA-Standalone.apk
          retention-days: 30
